<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Contato | Do'm Maior</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="../teste1.css" />
</head>

<body>

  <!-- IMAGEM FUNDO -->
  <div class="decoration">
    <img
      class="imagem-fundo"
      src="../images/notaSemicolcheia.svg"
      alt=""
    />
  </div>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar navbar-expand-lg" id="second-navbar">

      <div class="container-fluid justify-content-between">

      <a class="navbar-brand" href="../index.html">
          <img class="logo" src="../images/dommaior-logo.png" />
        </a>

        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

          <ul class="navbar-nav ms-auto">

          

            <li class="nav-item">
              <a class="nav-link nav-button" href="../about/index.html">
                Sobre
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link nav-button" href="../contato/index.html">
                Contato
              </a>
            </li>

          </ul>

        </div>

      </div>

    </nav>
  </header>

  <!-- MAIN -->
  <main>

    <div class="container-contato">

      <h2 class="titulo-contato">
        Entre em contato!
      </h2>

      <form id="meuFormulario">

        <div class="mb-3">

          <label for="nome" class="form-label">
            Nome
          </label>

          <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            placeholder="Seu nome"
            required
          />

        </div>

        <div class="mb-3">

          <label for="email" class="form-label">
            E-mail
          </label>

          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          />

        </div>

        <div class="mb-3">

          <label for="mensagem" class="form-label">
            Mensagem
          </label>

          <textarea
            class="form-control"
            id="mensagem"
            name="mensagem"
            rows="4"
            required
          ></textarea>

        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
        >
          Enviar
        </button>

        <div
          id="status-mensagem"
          class="alert alert-success alerta-contato"
          style="display: none;"
        >
          Mensagem enviada com sucesso!
        </div>

      </form>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>

    <div class="footer-conteudo">

      <div class="contato-instagram">

        <a
          href="https://www.instagram.com/joaobdiass/"
          target="_blank"
          class="link-instagram"
        >
          <span>Instagram: @joaobdiass</span>

          <i class="bi bi-instagram icone-instagram"></i>
        </a>

      </div>

      <div class="contato-whatsapp">

        <a
          href="https://wa.me/5511992944812"
          target="_blank"
          class="link-whatsapp"
        >
          <span>WhatsApp: (11) 99294-4812</span>

          <i class="bi bi-whatsapp icone-whatsapp"></i>
        </a>

      </div>

    </div>

  </footer>

  <!-- SCRIPT FORM -->
  <script>

    const form = document.getElementById("meuFormulario");

    const statusMsg =
      document.getElementById("status-mensagem");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const data =
        new FormData(event.target);

      try {

        const response = await fetch(
          "https://formsubmit.co/ajax/48043a756551c384c6ed328e46197d61",
          {
            method: "POST",
            body: data,
            headers: {
              Accept: "application/json",
            },
          }
        );

        if (response.ok) {

          statusMsg.style.display = "block";

          form.reset();

        } else {

          alert("Erro ao enviar.");

        }

      } catch (error) {

        alert("Problema na conexão.");

      }

    });

  </script>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
